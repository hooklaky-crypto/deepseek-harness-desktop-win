appId: com.deepseek.dsh-desktop
productName: DeepSeekHarnessDesktop
copyright: Copyright (c) 2026 DeepSeek Harness Desktop contributors

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - runtime/**/*
  - "!runtime/src/**"
  - "!runtime/package-lock.json"
  - "!runtime/pnpm-lock.yaml"

asar: true
asarUnpack:
  - runtime/**/*
compression: normal
npmRebuild: false
nodeGypRebuild: false

extraResources:
  - from: resources/node
    to: node
    filter:
      - "**/*"

win:
  target:
    - portable
    - nsis
  icon: build/icon.ico

portable:
  artifactName: DeepSeek-Harness-Desktop-${version}-portable.${ext}

nsis:
  artifactName: DeepSeek-Harness-Desktop-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DeepSeek Harness Desktop
